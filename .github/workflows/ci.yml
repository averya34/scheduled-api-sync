name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repository contents.
# The default GITHUB_TOKEN is far broader than that, and a compromised
# dependency or action would inherit whatever we grant here.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid series of pushes does not
# queue up minutes of pointless CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Run the whole matrix even if one version fails: knowing whether a
      # break is version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Smoke-test the example job in dry-run mode
        run: python examples/sync_contacts.py --dry-run
